<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thea · Presenter</title>
<link href="https://api.fontshare.com/v2/css?f[]=supreme@400,500,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#0f1116;font-family:'Supreme',system-ui,sans-serif;color:#e7e9ee}
.wrap{max-width:560px;margin:0 auto;padding:24px}
h1{font-size:18px;font-weight:700;margin:0}
.sub{font-size:12px;color:#7d818d;margin:2px 0 0}
.part{background:#14161c;border:1px solid #21242d;border-radius:14px;padding:16px;margin-top:16px}
.part > .ttl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#7d818d;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.sub-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9aa0ac;margin:16px 0 8px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:11px 6px;border:1px solid #272b34;border-radius:12px;background:#1b1e26;color:#c2c6cf;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s ease;line-height:1.15;text-align:center}
.btn.on{background:#4F73C6;border-color:#4F73C6;color:#fff}
.btn .k{font-size:9px;opacity:.65;font-weight:700}
.btn .d{font-size:10px;color:#8b8f9a;font-style:italic;margin-top:3px;font-weight:400}
.btn.on .d{color:rgba(255,255,255,.78)}
.fire{width:100%;padding:13px;border:0;border-radius:12px;background:#4F73C6;color:#fff;font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.04em;cursor:pointer;margin-top:9px}
.fire.alt{background:#2b2f3a;border:1px solid #3a3f4c}
.th-range{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:#2a2e38;outline:none}
.th-range::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#4F73C6;cursor:pointer;border:3px solid #11131a;box-shadow:0 0 0 1px #4F73C6}
.th-range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#4F73C6;cursor:pointer;border:3px solid #11131a}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.lines{display:flex;flex-direction:column;gap:7px}
.linebtn{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:1px solid #272b34;border-radius:12px;background:#1b1e26;cursor:pointer;width:100%;text-align:left;font-family:inherit}
#status{font-size:11px;color:#7d818d;margin-top:14px;min-height:16px;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <h1>Thea · Presenter</h1>
  <div class="sub">Backstage control — audience never sees this</div>

  <!-- PART 1 — the arc (scene setters: set headroom + selections, do NOT fire) -->
  <div class="part">
    <div class="ttl">The arc · beats <span style="text-transform:none;letter-spacing:0;color:#5a5e69">(sets the scene — the user fires via the device)</span></div>
    <div class="grid3" id="arc" style="grid-template-columns:repeat(5,1fr)"></div>
  </div>

  <!-- PART 2 — access commands (simulate the real interactions) -->
  <div class="part">
    <div class="ttl">Access commands <span style="text-transform:none;letter-spacing:0;color:#5a5e69">(force the device behaviour)</span></div>
    <div class="grid3" id="access"></div>
  </div>

  <!-- PART 3 — manual: fill + screen state + haptic -->
  <div class="part">
    <div class="ttl">Manual</div>

    <div class="row"><span class="sub-label" style="margin:0">Headroom fill</span><span id="fill-val" style="font-size:13px;font-weight:600;color:#cfd2da">20%</span></div>
    <input class="th-range" id="fill-slider" type="range" min="0" max="100" value="20">
    <div style="display:flex;justify-content:space-between;font-size:10px;color:#5a5e69;margin-top:5px"><span>headroom</span><span>at the edge</span></div>

    <div class="sub-label">Device screen state</div>
    <div class="grid3" id="screens"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px">
      <button class="fire" id="fire-screen" style="margin:0">Fire screen →</button>
      <button class="fire alt" id="set-headroom" style="margin:0">Set headroom →</button>
    </div>

    <div class="sub-label">Haptic pattern</div>
    <div class="grid3" id="haptics"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px">
      <button class="fire" id="fire-haptic" style="margin:0">Fire pulse →</button>
      <button class="fire alt" id="set-pattern" style="margin:0">Set pattern →</button>
    </div>

    <button class="fire alt" id="fire-both">Fire pulse + screen →</button>
  </div>

  <!-- PART 4 — script lines -->
  <div class="part">
    <div class="ttl">Script lines · fallback</div>
    <div class="lines" id="lines"></div>
  </div>

  <div id="status"></div>
</div>
<script>
(() => {
'use strict';

async function present(body) {
  const s = document.getElementById('status');
  try {
    const r = await fetch('/api/present', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    s.textContent = d.ok ? '✓ ' + JSON.stringify(body) : '✗ ' + (d.error || 'error');
    return d;
  } catch (e) { s.textContent = '✗ ' + e.message; }
}

// ── selection state + helpers ─────────────────────────────────────────────────
let selScreen = 0, selHaptic = 0;
const screenDefs = [{ id: 0, l: 'Gauge' }, { id: 1, l: 'Clear' }, { id: 2, l: 'Listen' }, { id: 3, l: 'Think' }, { id: 4, l: 'Speak' }, { id: 5, l: 'Alert' }];
const hapticDefs = [{ id: 0, l: 'None' }, { id: 1, l: 'Up·slow' }, { id: 2, l: 'Up·med' }, { id: 3, l: 'Up·quick' }, { id: 4, l: 'Dn·slow' }, { id: 5, l: 'Dn·med' }, { id: 6, l: 'Dn·quick' }];

function refreshSel(containerId, sel) {
  const el = document.getElementById(containerId);
  [...el.children].forEach(c => { c.className = 'btn' + (+c.dataset.id === sel ? ' on' : ''); });
}
function setScreenSel(id) { selScreen = id; refreshSel('screens', selScreen); }
function setHapticSel(id) { selHaptic = id; refreshSel('haptics', selHaptic); }

function buildSelect(containerId, defs, onPick) {
  const el = document.getElementById(containerId);
  defs.forEach(d => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.dataset.id = d.id;
    b.innerHTML = `<span class="k">${d.id}</span>${d.l}`;
    b.addEventListener('click', () => onPick(d.id));
    el.appendChild(b);
  });
}
buildSelect('screens', screenDefs, setScreenSel);
buildSelect('haptics', hapticDefs, setHapticSel);

// ── fill (set only — does not fire the screen) ────────────────────────────────
let fillLevel = 20, fillTimer = null;
const fillSlider = document.getElementById('fill-slider'), fillVal = document.getElementById('fill-val');
function setFillUI(level) { fillLevel = level; fillSlider.value = level; fillVal.textContent = level + '%'; }
fillSlider.addEventListener('input', () => { fillLevel = +fillSlider.value; fillVal.textContent = fillLevel + '%'; });  // value only — pressed via "Set headroom"

// ── Part 1: the arc — scene setters (set headroom + preselect; do NOT fire) ───
const arcDefs = [
  { key: 'S1', d: 'Rest',   fill: 10, screen: 0, haptic: 0 },
  { key: 'S2', d: 'Engage', fill: 44, screen: 2, haptic: 0 },
  { key: 'S3', d: 'Alert',  fill: 90, screen: 5, haptic: 3 },
  { key: 'S4', d: 'Action', fill: 86, screen: 4, haptic: 0 },
  { key: 'S5', d: 'Close',  fill: 22, screen: 1, haptic: 4 },
];
const arcEl = document.getElementById('arc');
arcDefs.forEach(a => {
  const b = document.createElement('button');
  b.className = 'btn';
  b.innerHTML = `<span class="k">${a.key}</span><span class="d">${a.d}</span>`;
  b.addEventListener('click', () => {
    setFillUI(a.fill);
    present({ cmd: 'setfill', level: a.fill });   // set the headroom on the device (no fire)
    setScreenSel(a.screen);
    setHapticSel(a.haptic);                        // preselect — the user fires it via the real button
  });
  arcEl.appendChild(b);
});

// ── Part 2: access commands — simulate the real interactions ──────────────────
const accessDefs = [
  { key: 'Status',      d: 'tap → status', run() { present({ cmd: 'button', kind: 'tap' }); } },
  { key: 'Recalibrate', d: 'hold → VUI',   run() { present({ cmd: 'button', kind: 'hold' }); } },
  { key: 'Alert',       d: 'high → CAW',   run() { present({ cmd: 'critical' }); } },
];
const accessEl = document.getElementById('access');
accessDefs.forEach(a => {
  const b = document.createElement('button');
  b.className = 'btn';
  b.innerHTML = `<span class="k">${a.key}</span><span class="d">${a.d}</span>`;
  b.addEventListener('click', a.run);
  accessEl.appendChild(b);
});

// ── Part 3: manual fire buttons ───────────────────────────────────────────────
document.getElementById('fire-screen').addEventListener('click', () => present({ cmd: 'screen', gid: selScreen }));
document.getElementById('fire-haptic').addEventListener('click', () => present({ cmd: 'haptic', hid: selHaptic }));
document.getElementById('fire-both').addEventListener('click', () => present({ cmd: 'play', hid: selHaptic, gid: selScreen }));
document.getElementById('set-headroom').addEventListener('click', () => present({ cmd: 'setfill', level: fillLevel }));
document.getElementById('set-pattern').addEventListener('click', () => present({ cmd: 'setpattern', hid: selHaptic }));

// ── Part 4: script lines ──────────────────────────────────────────────────────
const lineDefs = [
  { who: 'Thea', tag: '#7e97d6', text: "You've got plenty of headroom today — go." },
  { who: 'Thea', tag: '#7e97d6', text: "Pollen's building. Nothing urgent — I'll keep watch." },
  { who: 'Thea', tag: '#E89A5B', text: "You're right at your edge now. I'd head inside." },
  { who: 'Thea', tag: '#E89A5B', text: "This is the moment — time to take something." },
  { who: 'You',  tag: '#8b8f9a', text: "I'm okay — just give me a second." },
];
const linesEl = document.getElementById('lines');
lineDefs.forEach(l => {
  const b = document.createElement('button');
  b.className = 'linebtn';
  b.innerHTML = `<span style="font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:${l.tag};font-weight:700;flex-shrink:0">${l.who}</span><span style="font-size:12.5px;color:#cfd2da;line-height:1.35">${l.text}</span>`;
  b.addEventListener('click', () => present({ cmd: 'line', text: l.text }));
  linesEl.appendChild(b);
});

// init selection highlights
refreshSel('screens', selScreen);
refreshSel('haptics', selHaptic);

})();
</script>
</body>
</html>
